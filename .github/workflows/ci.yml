name: Test

on: [push, pull_request]

defaults:
  run:
    shell: bash

jobs:
  test:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build pytest

    - name: Build and install package
      run: |
        python -m build --wheel
        find dist -type f
        python -m pip install dist/*.whl

    - name: Test with pytest
      run: |
        pytest -v

    - name: Integration test
      run: |
        # build sasdata to make sure it builds the package

        # location of the wheel for hatch-sphinx (cross-platform messiness)
        WHL=$PWD/$(find dist -type f -name '*.whl' -print -quit)
        echo "Building with $WHL"

        if [[ "$RUNNER_OS" == "Windows" ]]; then
            # cygpath -m gives e.g. D:/a/hatch-sphinx/...whl
            WHL=/$(cygpath -m "$WHL")
            echo "Windows path: $WHL"
        fi
        CONSTRAINT="hatch-sphinx @ file://$WHL"
        echo "Building with $CONSTRAINT"

        # clean directory for this test
        mkdir buildtest
        cd buildtest

        # obtain the sdist for sasdata; if only this could be done reliably with pip
        python -m pip install unearth
        unearth --no-binary --download=. sasdata
        mkdir sasdata
        cd sasdata
        tar xf ../sasdata-*

        # build sasdata with the newly created hatch-sphinx wheel
        echo "$CONSTRAINT" > constraints.txt

        cd sasdata*
        python -m build --dependency-constraints-txt ../constraints.txt .

        # Rudimentary inspection of the wheel
        zipinfo dist/sasdata*whl
        if [ $(zipinfo dist/sasdata*whl | grep -c sasdata/docs/) -lt 100 ]; then
          echo "Didn't find sphinx output in wheel"
          exit 1
        fi
